<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1E3250">
<!-- ไอคอนบนหน้าจอโฮม (BGM) -->
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ใช้รถส่วนกลาง">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>ระบบใช้รถส่วนกลาง</title>
<style>
  html, body { margin: 0; height: 100%; background: #F4F6F8; }
  iframe { border: 0; width: 100%; height: 100%; height: 100dvh; display: block; }
  noscript { display: block; padding: 24px; font: 16px system-ui, sans-serif; }
</style>
</head>
<body>
<!-- หน้าครอบแอป: ฝังเว็บแอป Google Apps Script ไว้ข้างใน เพื่อไม่ให้แสดงแถบคำเตือนของ Google -->
<iframe id="app" title="ระบบใช้รถส่วนกลาง" allow="clipboard-write; camera"></iframe>
<noscript>กรุณาเปิด JavaScript เพื่อใช้งานระบบ</noscript>
<script>
  // ลิงก์เว็บแอป (Deploy ของ Apps Script)
  var EXEC_URL = 'https://script.google.com/macros/s/AKfycbwBLpUfxyZj0BqFLddcIWWbgtgn7GlxbTSv0TYDBrGAKPaqGTj156sUMUGGNEw3Wem4/exec';
  // ส่งต่อพารามิเตอร์ลิงก์อนุมัติ (?page=approve&id=...) เข้าไปในแอป
  var q = new URLSearchParams(location.search), p = new URLSearchParams();
  ['page', 'id'].forEach(function (k) {
    var v = q.get(k);
    if (v && /^[A-Za-z0-9-]{1,40}$/.test(v)) p.set(k, v);
  });
  document.getElementById('app').src = EXEC_URL + (p.toString() ? '?' + p.toString() : '');
</script>
</body>
</html>
